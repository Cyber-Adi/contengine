name: weekly tap

# Runs the mechanical pass (validate -> render -> export) unattended, so by the
# time Adi opens the repo the rendering has already happened overnight.
# See docs/GITHUB-SETUP.md. Never writes copy, never publishes, never touches a gate.

on:
  schedule:
    # 09:00 UTC daily. Cheap (nothing to do -> exits fast) and means any spec
    # landing any day is rendered before the next session, not just once a week.
    - cron: '0 9 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'specs/**.json'
      - 'briefs/**'

# Don't let two runs race each other's git push.
concurrency:
  group: weekly-tap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tap:
    # Skip runs the bot's own commit would otherwise re-trigger via the push filter.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: install chromium
        run: npx playwright install --with-deps chromium

      - name: install python deps (qa.py needs Pillow/numpy/pytesseract + tesseract-ocr for gate 4.5)
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr
          pip install --quiet pillow numpy pytesseract

      # Gate regressions must not ship in the daily commit: a failure here stops the job
      # before tap and push. Suites generate their own post-9xxx fixtures (ignored by VCS).
      - name: run test suites (gates, autonomy, fidelity, package)
        run: npm run test:all

      - name: run the tap
        run: npm run tap

      - name: commit and push anything the tap produced
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- out/ specs/ state/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          # A ledger-only commit whose sole change is `updatedAt` is timestamp
          # churn, not real state. Drop it so daily runs stop diverging from a
          # clean HEAD when there is nothing to actually report.
          if git diff --cached --name-only | grep -qv '^state/ledger\.json$'; then
            : # real files changed, keep going
          elif [ "$(git diff --cached -U0 -- state/ledger.json | grep -c '^[+-]  "')" -le 2 ]; then
            echo "only ledger timestamp changed — nothing to commit"
            git reset --quiet
            exit 0
          fi
          git commit -m "chore: weekly tap render/export [skip ci]"
          # Retry the push a few times: a transient GitHub 5xx (seen 2026-09-23)
          # should not fail the whole run silently until the next tap notices.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push failed (attempt $attempt) — rebasing onto origin/main and retrying"
            git pull --rebase origin main || { echo "rebase failed, giving up"; exit 1; }
            sleep $((attempt * 5))
          done
          echo "push failed after 3 attempts"
          exit 1
